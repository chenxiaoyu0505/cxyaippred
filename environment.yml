# conda env：cxyaippred
#
#   conda env create -f environment.yml
#   conda activate cxyaippred
#   python scripts/check_env.py
#
# torch 走 pip 安装（各平台 wheel 不同，conda 频道常常滞后）：
#   NVIDIA 50 系 / cu128 : pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cu128
#   Apple Silicon (MPS)  : pip install torch
#   CPU only             : pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# GPU 环境还要额外装对应的 CUDA runtime（pip 的 cu128 wheel 已自带，无需系统 CUDA）。

name: cxyaippred
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=24
  - numpy>=1.26,<2.0
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pip:
      - transformers==4.48.1
      - tokenizers==0.21.4
      - safetensors>=0.4
      - huggingface-hub>=0.24
      - biopython>=1.81
      - tqdm>=4.66
